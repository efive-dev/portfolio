---
layout: default
---
<main class="post" id="main">
  <div class="post__head">
    <a class="post__back" href="{{ '/blog/' | relative_url }}"><svg class="arr arr--back" viewBox="0 0 16 16"
        aria-hidden="true">
        <path d="M13 8H3M7 4L3 8l4 4" />
      </svg> All posts</a>
    <div class="post__meta">
      <time class="post__date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags.size > 0 %}
      <ul class="post__tags">{% for t in page.tags %}<li class="pill">{{ t }}</li>{% endfor %}</ul>
      {% endif %}
    </div>
    <h1 class="post__title">{{ page.title }}</h1>
  </div>

  <article class="article">
    {{ content }}
  </article>

  <div class="post__foot">
    <a href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a>
  </div>
</main>
