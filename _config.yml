title: "Edoardo Quinto"
description: "Portfolio"

baseurl: "/portfolio"

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.zip"
